{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-transparent text-center py-4">
          <h3 class="mb-1">Password Reset Complete</h3>
          <p class="text-muted mb-0">Your password has been successfully updated</p>
        </div>
        <div class="card-body text-center">
          <div class="mb-4">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
          </div>
          <p class="text-muted mb-4">
            Your password has been set. You may now log in securely using your new credentials.
          </p>
          <div class="d-grid gap-2">
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Sign In Now</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
