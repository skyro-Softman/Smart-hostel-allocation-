{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-transparent text-center py-4">
          <h3 class="mb-1">Reset Password</h3>
          <p class="text-muted mb-0">Enter your email address and we'll send you a link to reset your password.</p>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
              <label class="form-label" for="{{ form.email.id_for_label }}">Email address</label>
              {{ form.email }}
              {{ form.email.errors }}
            </div>
            <div class="d-grid gap-2">
              <button class="btn btn-primary btn-lg" type="submit">Reset Password</button>
            </div>
          </form>
          <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="text-decoration-none" style="color: #00897b;">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
